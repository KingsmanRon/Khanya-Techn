# MTP - Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'MTP Dashboards'
    orgId: 1
    folder: 'MTP'
    folderUid: 'mtp'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
